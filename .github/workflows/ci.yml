name: CI

on: 
  push: 
    branches: 
      -main

jobs:
  build:
    name: "Build and push"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup node
        uses: actions/setup-node@v5
        with: 
          node-version: 22
          cache: ./api/package-lock.json
      
      - run: npm i
      - run: npm run test
